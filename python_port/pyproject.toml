[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ims-port"
version = "2.0.0-alpha.1"
description = "Schrittweise Python-Portierung des historischen IMS/ESS-Modells"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pytest>=8.0",
    "uvicorn>=0.30",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q ../tests"

[tool.setuptools]
packages = ["ims", "ims.analysis", "ims.api", "ims.model", "ims.engine", "ims.io"]

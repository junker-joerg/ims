name: IMS AI sprint plan

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/plans/**"
      - "docs/research/**"
      - "docs/reports/ims_board_baseline*"
      - "scripts/planning/**"
      - "tests/test_ai_sprint_plan*.py"
      - ".github/workflows/ims-ai-sprint.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "docs/plans/**"
      - "docs/research/**"
      - "docs/reports/ims_board_baseline*"
      - "scripts/planning/**"
      - "tests/test_ai_sprint_plan*.py"
      - ".github/workflows/ims-ai-sprint.yml"
  workflow_dispatch:
    inputs:
      package:
        description: "Arbeitsauftrag vorbereiten; startet keine Codex-Ausführung"
        type: choice
        default: auto
        options: [auto, AP1, AP2, AP3, AP4, AP5, AP6, AP7, AP8, AP9, AP10, AP11, AP12, AP13, AP14]
      plan:
        description: "Plan wählen; CI erstellt ausschließlich Vorschauen"
        type: choice
        default: board
        options: [legacy, market, board]

permissions:
  contents: read

concurrency:
  group: ims-ai-sprint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan prüfen und Codex-Auftrag vorbereiten
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE_ID: ${{ inputs.package || 'auto' }}
      CHECKED_COMMIT: ${{ github.sha }}
      PLAN_KIND: ${{ inputs.plan || 'board' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prüflogik testen
        run: python -m unittest discover -s tests -p 'test_ai_sprint_plan*.py' -v
      - name: Kompatiblen AP1–AP3-Plan prüfen
        run: python scripts/planning/ims_sprint_plan.py --out "$RUNNER_TEMP/ims-legacy"
      - name: Plan prüfen und Arbeitsauftrag erzeugen
        run: |
          case "$PLAN_KIND" in
            legacy)
              python scripts/planning/ims_sprint_plan.py --package "$PACKAGE_ID" \
                --commit "$CHECKED_COMMIT" --out "$RUNNER_TEMP/ims-sprint"
              ;;
            market) PLAN_FILE=docs/plans/ims_explainable_market_plan.json ;;
            board) PLAN_FILE=docs/plans/ims_board_strategy_plan.json ;;
            *) exit 1 ;;
          esac
          if [ "$PLAN_KIND" != legacy ]; then
            python scripts/planning/ims_sprint_plan.py --plan "$PLAN_FILE" \
              --package "$PACKAGE_ID" --mode preview \
              --commit "$CHECKED_COMMIT" --out "$RUNNER_TEMP/ims-sprint"
          fi
          cat "$RUNNER_TEMP/ims-sprint/plan-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Planbericht und Arbeitsauftrag bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ims-sprint-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ims-sprint/*.md
          if-no-files-found: error
          retention-days: 14

name: Windows installer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned build dependencies in checkout environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r scripts/installer/requirements-build.txt
          .\.venv\Scripts\python.exe -m pip install --no-deps -e python_port
      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: .\scripts\installer\install-build-tools.ps1
      - name: Check shared release number
        id: release
        shell: pwsh
        run: |
          $release = .\.venv\Scripts\python.exe scripts/installer/release_metadata.py
          if ($LASTEXITCODE -ne 0) { throw 'Release versions are inconsistent' }
          $release = $release | ConvertFrom-Json
          "version=$($release.version)" >> $env:GITHUB_OUTPUT
          "artifact=$($release.artifact)" >> $env:GITHUB_OUTPUT
      - name: Build actual installer with SHA-256 and inventory
        shell: pwsh
        run: .\scripts\installer\build-installer.ps1
      - name: Build synthetic preceding installer for update lifecycle
        shell: pwsh
        run: |
          .\build\inno\compiler\ISCC.exe /DAppVersion=2.0.0-alpha.0 /DFileVersion=2.0.0.0 scripts/installer/ims.iss
          if ($LASTEXITCODE -ne 0) { throw 'Previous installer build failed' }
      - name: Exercise installation, frozen model exports, update and uninstall
        shell: pwsh
        run: |
          .\frontend\node_modules\.bin\playwright.cmd install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
          .\.venv\Scripts\python.exe scripts/installer/test_installer.py --installer "dist/installer/${{ steps.release.outputs.artifact }}" --previous-installer dist/installer/IMS-Setup-2.0.0-alpha.0-win-x64.exe --out .tmp-pr-installer --browser-checks
          if ($LASTEXITCODE -ne 0) { throw 'Installer acceptance failed' }
      - name: Upload installer and evidence, no public release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IMS-Windows-x64-${{ steps.release.outputs.version }}-${{ github.sha }}
          path: |
            dist/installer/${{ steps.release.outputs.artifact }}
            dist/installer/${{ steps.release.outputs.artifact }}.sha256
            dist/installer/build-evidence.json
            dist/installer/resource-inventory.json
            .tmp-pr-installer/installer-test-evidence.json
            .tmp-pr-ap2/browser-report.json
            .tmp-pr-ap2/browser-results
          if-no-files-found: error
          retention-days: 30
